syntax = "proto3";

option csharp_namespace = "PRN232.LMS.Grpc";

package student;

service StudentGrpc {
  rpc GetStudentById (GetStudentByIdRequest) returns (GetStudentByIdResponse);
}

message GetStudentByIdRequest {
  int32 student_id = 1;
}

message GetStudentByIdResponse {
  bool exists = 1;
  int32 student_id = 2;
  string full_name = 3;
  string email = 4;
}

