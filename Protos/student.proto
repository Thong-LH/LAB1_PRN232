syntax = "proto3";

option csharp_namespace = "PRN232.LMS.Grpc";

package student;

service StudentGrpc {
  rpc GetStudentById (GetStudentRequest) returns (StudentResponse);
}

message GetStudentRequest {
  int32 id = 1;
}

message StudentResponse {
  int32 student_id = 1;
  string full_name = 2;
  string email = 3;
  bool exists = 4;
}
